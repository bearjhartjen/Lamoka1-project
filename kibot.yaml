kibot:
  version: 1

preflight:
  run_erc: true
  run_drc: true

outputs:
  - name: "gerbers"
    type: gerber
    options:
      output_directory: "Fabrication/Gerbers"
      force_edge_cuts: true
      use_gerber_x2_extensions: true

  - name: "drill_files"
    type: excellon
    options:
      output_directory: "Fabrication/Drills"

  - name: "schematic_pdf"
    type: pdf_sch_print
    options:
      output_name: "Documentation/Lamoka1_Schematic.pdf"

  - name: "bom_csv"
    type: bom
    options:
      output_name: "Documentation/Lamoka1_BOM.csv"