kibot:
  version: 1

preflight:
  run_erc: true
  run_drc: true

outputs:
  - name: gerbers
    type: gerber
    dir: Fabrication/Gerbers

  - name: drill_files
    type: excellon
    dir: Fabrication/Drills

  - name: position_files
    type: position
    dir: Fabrication/PickAndPlace

  - name: schematic_pdf
    type: pdf_sch_print
    dir: Documentation
    options:
      output: Lamoka1_Schematic.pdf

  - name: bom_csv
    type: bom
    dir: Documentation
    options:
      output: Lamoka1_BOM.csv
      format: CSV