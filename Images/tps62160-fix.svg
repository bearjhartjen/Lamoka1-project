<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" font-family="Arial,sans-serif">
<rect width="900" height="520" fill="#0b1220"/>
<text x="20" y="30" fill="#ff5555" font-size="20" font-weight="bold">YOURS NOW — long string, big SW antenna</text>
<text x="480" y="30" fill="#55ff88" font-size="20" font-weight="bold">TI WAY (WBDesign2 + datasheet)</text>
<!-- LEFT bad -->
<g>
  <rect x="60" y="60" width="120" height="50" fill="none" stroke="#4cc3ff" stroke-width="2"/>
  <text x="70" y="80" fill="#4cc3ff" font-size="13">Cout (C25)</text>
  <text x="70" y="98" fill="#8899aa" font-size="11">far from L — BAD</text>
  <rect x="60" y="160" width="120" height="70" fill="none" stroke="#4cc3ff" stroke-width="2"/>
  <text x="70" y="182" fill="#4cc3ff" font-size="13">L3</text>
  <text x="70" y="200" fill="#8899aa" font-size="11">15mm from U7</text>
  <rect x="60" y="280" width="120" height="70" fill="none" stroke="#4cc3ff" stroke-width="2"/>
  <text x="70" y="302" fill="#4cc3ff" font-size="13">U7 TPS62160</text>
  <text x="70" y="320" fill="#8899aa" font-size="11">Cin far away</text>
  <rect x="60" y="390" width="120" height="45" fill="none" stroke="#4cc3ff" stroke-width="2"/>
  <text x="70" y="410" fill="#4cc3ff" font-size="13">Cin (C24)</text>
  <!-- long traces -->
  <line x1="120" y1="110" x2="120" y2="160" stroke="#4488ff" stroke-width="8"/>
  <line x1="120" y1="230" x2="120" y2="280" stroke="#ff9900" stroke-width="12"/>
  <text x="135" y="255" fill="#ff9900" font-size="12">huge SW pour = EMI</text>
  <line x1="120" y1="350" x2="120" y2="390" stroke="#ff3333" stroke-width="6"/>
  <line x1="200" y1="110" x2="260" y2="300" stroke="#33ff66" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="210" y="210" fill="#33ff66" font-size="12">FB (R20/R21)</text>
  <text x="210" y="226" fill="#33ff66" font-size="12">long, next to SW = noisy</text>
  <text x="230" y="340" fill="#ff5555" font-size="13">✘ loop ~25mm</text>
</g>
<!-- divider -->
<line x1="450" y1="50" x2="450" y2="500" stroke="#334455" stroke-width="2"/>
<!-- RIGHT good -->
<g>
  <!-- U7 center -->
  <rect x="580" y="240" width="140" height="110" fill="#16283f" stroke="#55ff88" stroke-width="2"/>
  <text x="600" y="265" fill="#55ff88" font-size="14" font-weight="bold">U7 TPS62160</text>
  <text x="600" y="285" fill="#8899aa" font-size="11">VIN ●—● PGND</text>
  <text x="600" y="300" fill="#8899aa" font-size="11">SW ●—● FB/VOS</text>
  <!-- Cin hugging top -->
  <rect x="580" y="170" width="140" height="45" fill="none" stroke="#ff5555" stroke-width="2"/>
  <text x="590" y="188" fill="#ff8888" font-size="13">Cin C24 10uF</text>
  <text x="590" y="204" fill="#8899aa" font-size="11">touching VIN/GND</text>
  <line x1="600" y1="215" x2="600" y2="240" stroke="#ff3333" stroke-width="6"/>
  <line x1="700" y1="215" x2="700" y2="240" stroke="#222222" stroke-width="6"/>
  <!-- L tight right of SW -->
  <rect x="740" y="240" width="110" height="110" fill="none" stroke="#ff9900" stroke-width="2"/>
  <text x="750" y="265" fill="#ff9900" font-size="14">L3 2.2uH</text>
  <text x="750" y="283" fill="#8899aa" font-size="11">2-3mm stub</text>
  <line x1="720" y1="280" x2="740" y2="280" stroke="#ff9900" stroke-width="8"/>
  <text x="722" y="272" fill="#ff9900" font-size="11">SW</text>
  <!-- Cout tight at L output -->
  <rect x="740" y="370" width="110" height="45" fill="none" stroke="#4488ff" stroke-width="2"/>
  <text x="748" y="388" fill="#88bbff" font-size="13">Cout C25 22u</text>
  <text x="748" y="404" fill="#8899aa" font-size="11">touching L out</text>
  <line x1="790" y1="350" x2="790" y2="370" stroke="#4488ff" stroke-width="8"/>
  <!-- FB divider at Cout, away -->
  <rect x="540" y="370" width="150" height="60" fill="none" stroke="#33ff66" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="545" y="388" fill="#33ff66" font-size="12">R20 953k / R19 180k</text>
  <text x="545" y="404" fill="#33ff66" font-size="11">at Cout pads, short</text>
  <text x="545" y="418" fill="#33ff66" font-size="11">Kelvin sense, far from SW</text>
  <line x1="690" y1="390" x2="740" y2="390" stroke="#33ff66" stroke-width="2"/>
  <!-- GND plane note -->
  <rect x="540" y="445" width="310" height="40" fill="#0f2a1a" stroke="#33ff66" stroke-width="1"/>
  <text x="550" y="462" fill="#55ff88" font-size="12">solid GND under all — Cin/L/Cout GND vias to plane</text>
  <text x="550" y="478" fill="#55ff88" font-size="12">✔ loop ~5mm ✔ SW tiny ✔ FB quiet</text>
</g>
<text x="20" y="505" fill="#8899aa" font-size="12">Rule: Cin → U7 → L → Cout must fit in one tight cluster. Your WBDesign2.svg is schematic-only — routing comes from TPS62160 datasheet §11.</text>
</svg>