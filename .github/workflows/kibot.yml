name: KiBot Hardware CI

on:
  push:
    branches: [ Lamoka1 ]
  pull_request:
    branches: [ Lamoka1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run KiBot
        run: |
          kibot \
            -c kibot.yaml \
            -b HARDWARE/kicadfiles/Lamoka1/Lamoka1.kicad_pcb \
            -e HARDWARE/kicadfiles/Lamoka1/Lamoka1.kicad_sch \
            -d KiBot_Output

      - name: Upload KiBot outputs
        uses: actions/upload-artifact@v4
        with:
          name: Lamoka1_KiBot_Output
          path: KiBot_Output/
          retention-days: 30